<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">AI 员工：从问题到源码依据</title>
  <desc id="desc">用户问题经过工作台权限和上下文装配进入 OpenCode。OpenCode 按需检索业务知识、案例、CodeGraph 与授权范围的源码，输出有来源的回答。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#6c8798"/></marker></defs>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#243746;letter-spacing:0}
    .title{font-size:38px;font-weight:700}.sub{font-size:23px;fill:#647785}
    .heading{font-size:26px;font-weight:700}.body{font-size:22px;fill:#526a7a}
    .label{font-size:21px;fill:#526a7a}.note{font-size:21px;fill:#647785}
    .arrow{fill:none;stroke:#6c8798;stroke-width:2.5;marker-end:url(#arrow)}
    .line{fill:none;stroke:#6c8798;stroke-width:2.5}
  </style>
  <rect width="1440" height="860" fill="#fff"/>
  <text x="64" y="72" class="title">AI 员工：从问题到源码依据</text>
  <text x="64" y="118" class="sub">选择 App → 检索上下文 → 流式回答，保留可追溯来源</text>
  <g><rect x="64" y="182" width="384" height="148" rx="8" fill="#f8fafc" stroke="#d0dce5"/>
    <text x="256" y="225" text-anchor="middle" class="heading">用户问题</text>
    <text x="256" y="264" text-anchor="middle" class="body">文字 / @类名 / 图片</text>
    <text x="256" y="297" text-anchor="middle" class="body">文档「问 AI」携带原文与路径</text>
  </g>
  <g><rect x="528" y="182" width="384" height="148" rx="8" fill="#eef6ff" stroke="#c3d9ed"/>
    <text x="720" y="225" text-anchor="middle" class="heading">工作台</text>
    <text x="720" y="264" text-anchor="middle" class="body">Token 与 App 权限校验</text>
    <text x="720" y="297" text-anchor="middle" class="body">装配上下文、复用会话</text>
  </g>
  <g><rect x="992" y="182" width="384" height="148" rx="8" fill="#eef6ff" stroke="#c3d9ed"/>
    <text x="1184" y="225" text-anchor="middle" class="heading">OpenCode</text>
    <text x="1184" y="264" text-anchor="middle" class="body">模型推理与工具调用</text>
    <text x="1184" y="297" text-anchor="middle" class="body">按问题选择检索路径</text>
  </g>
  <path d="M448 256H528" class="arrow"/>
  <path d="M912 256H992" class="arrow"/>
  <rect y="424" width="1440" height="216" fill="#f6f8fa"/>
  <text x="64" y="466" class="heading">按需读取的知识与源码</text>
  <g><rect x="64" y="494" width="384" height="112" rx="8" fill="#f0f9f5" stroke="#bfdfd0"/>
    <text x="256" y="537" text-anchor="middle" class="heading">业务知识与迁移案例</text>
    <text x="256" y="576" text-anchor="middle" class="body">规则、代码地图、历史方案</text>
  </g>
  <g><rect x="528" y="494" width="384" height="112" rx="8" fill="#f0f9f5" stroke="#bfdfd0"/>
    <text x="720" y="537" text-anchor="middle" class="heading">CodeGraph</text>
    <text x="720" y="576" text-anchor="middle" class="body">类定位、调用链、影响范围</text>
  </g>
  <g><rect x="992" y="494" width="384" height="112" rx="8" fill="#f0f9f5" stroke="#bfdfd0"/>
    <text x="1184" y="537" text-anchor="middle" class="heading">Android / HarmonyOS</text>
    <text x="1184" y="576" text-anchor="middle" class="body">仅限当前 App 授权源码</text>
  </g>
  <path d="M1184 330V379H256V494" class="arrow"/>
  <path d="M720 379V494" class="arrow"/>
  <path d="M1184 379V494" class="arrow"/>
  <text x="64" y="696" class="heading">输出</text>
  <text x="64" y="738" class="note">分析正文 + 引用来源 + 执行说明</text>
  <text x="64" y="785" class="note">例如：选择酷狗直播，追问「首页卡片点击后走哪个接口？」</text>
  <text x="858" y="696" class="heading">执行边界</text>
  <text x="858" y="738" class="note">只读查询；代码草稿在回答中给出</text>
  <text x="858" y="785" class="note">断流保留正文，并标记未完成</text>
</svg>
