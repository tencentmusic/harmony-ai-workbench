<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">迁移案例：把一次迁移变成可复用资料</title>
  <desc id="desc">从 App、功能点和源码材料出发，由匹配业务域的 Skill 整理迁移案例，人工核实后经外部案例仓 MR 发布，供知识门户和 AI 使用。文档确认后可选进入鸿蒙代码生成，历史案例不直接成为当前业务规则。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#6c8798"/></marker></defs>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#243746;letter-spacing:0}
    .title{font-size:38px;font-weight:700}.sub{font-size:23px;fill:#647785}
    .heading{font-size:26px;font-weight:700}.body{font-size:22px;fill:#526a7a}
    .label{font-size:21px;fill:#526a7a}.note{font-size:21px;fill:#647785}
    .arrow{fill:none;stroke:#6c8798;stroke-width:2.5;marker-end:url(#arrow)}
    .line{fill:none;stroke:#6c8798;stroke-width:2.5}
  </style>
  <rect width="1440" height="860" fill="#fff"/>
  <text x="64" y="72" class="title">迁移案例：把一次迁移变成可复用资料</text>
  <text x="64" y="118" class="sub">源码依据 → 结构化案例 → 人工核实 → 内容仓发布</text>
  <g><rect x="64" y="180" width="384" height="148" rx="8" fill="#f8fafc" stroke="#d0dce5"/>
    <text x="256" y="223" text-anchor="middle" class="heading">1  准备依据</text>
    <text x="256" y="262" text-anchor="middle" class="body">App、功能点、业务域</text>
    <text x="256" y="295" text-anchor="middle" class="body">Android / HarmonyOS 源码与材料</text>
  </g>
  <g><rect x="528" y="180" width="384" height="148" rx="8" fill="#eef6ff" stroke="#c3d9ed"/>
    <text x="720" y="223" text-anchor="middle" class="heading">2  编写案例</text>
    <text x="720" y="262" text-anchor="middle" class="body">使用对应业务域文档 Skill</text>
    <text x="720" y="295" text-anchor="middle" class="body">链路、差异、资源与验收依据</text>
  </g>
  <g><rect x="992" y="180" width="384" height="148" rx="8" fill="#fff8e8" stroke="#e6d59f"/>
    <text x="1184" y="223" text-anchor="middle" class="heading">3  人工核实</text>
    <text x="1184" y="262" text-anchor="middle" class="body">核对源码、接口、常量和资源</text>
    <text x="1184" y="295" text-anchor="middle" class="body">未核实项保留 ASSUMPTION</text>
  </g>
  <path d="M448 255H528" class="arrow"/>
  <path d="M912 255H992" class="arrow"/>
  <path d="M1184 328V430" class="arrow"/>
  <g><rect x="992" y="430" width="384" height="148" rx="8" fill="#fff8e8" stroke="#e6d59f"/>
    <text x="1184" y="473" text-anchor="middle" class="heading">4  外部案例仓 MR</text>
    <text x="1184" y="512" text-anchor="middle" class="body">内容和链接检查</text>
    <text x="1184" y="545" text-anchor="middle" class="body">人工审核合入</text>
  </g>
  <g><rect x="528" y="430" width="384" height="148" rx="8" fill="#f0f9f5" stroke="#bfdfd0"/>
    <text x="720" y="473" text-anchor="middle" class="heading">5  工作台复用</text>
    <text x="720" y="512" text-anchor="middle" class="body">门户阅读 / 搜索 / 问 AI</text>
    <text x="720" y="545" text-anchor="middle" class="body">按配置同步内容与检索</text>
  </g>
  <path d="M992 505H912" class="arrow"/>
  <g><rect x="64" y="430" width="384" height="148" rx="8" fill="#f8fafc" stroke="#d0dce5"/>
    <text x="256" y="473" text-anchor="middle" class="heading">可选：鸿蒙代码生成</text>
    <text x="256" y="512" text-anchor="middle" class="body">文档确认后进入编码</text>
    <text x="256" y="545" text-anchor="middle" class="body">KTV 使用对应代码 Skill</text>
  </g>
  <path d="M1184 328V380H256V430" class="arrow"/>
  <rect y="651" width="1440" height="170" fill="#f6f8fa"/>
  <text x="64" y="696" class="note">案例内容：README 主文 + 复杂业务专项 + 弹窗 / 图片资源（按需）</text>
  <text x="64" y="743" class="note">例如：KTV 弹窗案例，记录入口、接口参数、双端差异及资源来源。</text>
  <text x="64" y="787" class="note">历史案例用于复用经验；要成为当前业务知识，还需另行审核。</text>
</svg>
