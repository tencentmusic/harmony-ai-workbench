<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">集成台：分支审查与合入协作</title>
  <desc id="desc">普通提测单固定 Git 版本后在独立 detached worktree 与集成 OpenCode 中执行审查和测试用例 Skill。报告绑定提交版本，由团队执行测试、复审和合入。转译交接不重复触发首次审查。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#6c8798"/></marker></defs>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#243746;letter-spacing:0}
    .title{font-size:38px;font-weight:700}.sub{font-size:23px;fill:#647785}
    .heading{font-size:26px;font-weight:700}.body{font-size:22px;fill:#526a7a}
    .label{font-size:21px;fill:#526a7a}.note{font-size:21px;fill:#647785}
    .arrow{fill:none;stroke:#6c8798;stroke-width:2.5;marker-end:url(#arrow)}
    .line{fill:none;stroke:#6c8798;stroke-width:2.5}
  </style>
  <rect width="1440" height="860" fill="#fff"/>
  <text x="64" y="72" class="title">集成台：分支审查与合入协作</text>
  <text x="64" y="118" class="sub">固定 Git 快照，隔离执行审查，把报告交给开发和测试</text>
  <g><rect x="64" y="180" width="384" height="145" rx="8" fill="#f8fafc" stroke="#d0dce5"/>
    <text x="256" y="223" text-anchor="middle" class="heading">提测信息</text>
    <text x="256" y="262" text-anchor="middle" class="body">App、源 / 目标分支</text>
    <text x="256" y="295" text-anchor="middle" class="body">需求、范围与负责人</text>
  </g>
  <g><rect x="528" y="180" width="384" height="145" rx="8" fill="#eef6ff" stroke="#c3d9ed"/>
    <text x="720" y="223" text-anchor="middle" class="heading">固定 Git 快照</text>
    <text x="720" y="262" text-anchor="middle" class="body">base / head / target + diff</text>
    <text x="720" y="295" text-anchor="middle" class="body">报告绑定本轮提交版本</text>
  </g>
  <g><rect x="992" y="180" width="384" height="145" rx="8" fill="#eef6ff" stroke="#c3d9ed"/>
    <text x="1184" y="223" text-anchor="middle" class="heading">隔离执行环境</text>
    <text x="1184" y="262" text-anchor="middle" class="body">detached worktree</text>
    <text x="1184" y="295" text-anchor="middle" class="body">集成 OpenCode :4110</text>
  </g>
  <path d="M448 252H528" class="arrow"/>
  <path d="M912 252H992" class="arrow"/>
  <g><rect x="528" y="435" width="384" height="145" rx="8" fill="#f0f9f5" stroke="#bfdfd0"/>
    <text x="720" y="478" text-anchor="middle" class="heading">代码审查 Skill</text>
    <text x="720" y="517" text-anchor="middle" class="body">风险与问题清单</text>
    <text x="720" y="550" text-anchor="middle" class="body">待合入时触发复审</text>
  </g>
  <g><rect x="992" y="435" width="384" height="145" rx="8" fill="#f0f9f5" stroke="#bfdfd0"/>
    <text x="1184" y="478" text-anchor="middle" class="heading">测试用例 Skill</text>
    <text x="1184" y="517" text-anchor="middle" class="body">需求对应的测试用例</text>
    <text x="1184" y="550" text-anchor="middle" class="body">交给团队实际执行</text>
  </g>
  <path d="M1184 325V378H720V435" class="arrow"/>
  <path d="M1184 378V435" class="arrow"/>
  <g><rect x="64" y="435" width="384" height="145" rx="8" fill="#fff8e8" stroke="#e6d59f"/>
    <text x="256" y="478" text-anchor="middle" class="heading">人工测试与合入</text>
    <text x="256" y="517" text-anchor="middle" class="body">阅读报告、执行测试</text>
    <text x="256" y="550" text-anchor="middle" class="body">团队审核 MR 并合入</text>
  </g>
  <path d="M528 507H448" class="arrow"/>
  <path d="M1184 580V626H256V580" class="arrow"/>
  <rect y="672" width="1440" height="142" fill="#f6f8fa"/>
  <text x="64" y="716" class="note">状态：开发中 → 已提测 → 待合入 → 已合入；也可关闭</text>
  <text x="64" y="759" class="note">转译交接：开发确认本地复核后建单；不重复触发已完成的交接审查。</text>
  <text x="64" y="797" class="note">报告不自动合并代码；生成用例不等于测试已执行，状态标签不替代真实 Git 合入。</text>
</svg>
